project_id = "steward"

[api]
enabled = true
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]

[db]
major_version = 17

[auth]
enabled = true
site_url = "https://steward-sage.vercel.app"
additional_redirect_urls = [
  "https://steward-sage.vercel.app/auth/callback",
  "http://localhost:3000/auth/callback",
  "http://localhost:3002/auth/callback",
]

[auth.mfa]
max_enrolled_factors = 10

[auth.mfa.totp]
enroll_enabled = true
verify_enabled = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = true
secure_password_change = false
max_frequency = "1m"
otp_length = 8
otp_expiry = 3600
